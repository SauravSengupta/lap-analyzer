name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = the declared floor (pyproject requires-python); 3.14 = the
        # version the suite is developed/run on.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        # Scoped to tests/ for now — lap_analyzer/ has pre-existing ruff findings
        # tracked separately; widen to `lap_analyzer tests` once those are cleaned.
        run: python -m ruff check tests
      - name: Test
        run: python -m pytest
